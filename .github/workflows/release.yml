name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v5.9.18)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache embedder model
        uses: actions/cache@v4
        with:
          path: .cache/embedder
          key: embedder-minilm-l6-v2-${{ hashFiles('scripts/build-doc-index.ts', 'src/lib/chat/embedder.ts') }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Build release APKs
        run: |
          yarn build:doc-index
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Find APKs
        id: apks
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          ARM64=$(find android/app/build/outputs/apk -name "*arm64-v8a*release*.apk" | head -1)
          X86=$(find android/app/build/outputs/apk -name "*x86_64*release*.apk" | head -1)
          if [ -z "$ARM64" ] || [ -z "$X86" ]; then
            echo "Could not find release APKs"
            find android/app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          ARM64_OUT="build/${TAG}-UmaAndroidAutomation-arm64-v8a-release.apk"
          X86_OUT="build/${TAG}-UmaAndroidAutomation-x86_64-release.apk"
          mkdir -p build
          cp "$ARM64" "$ARM64_OUT"
          cp "$X86" "$X86_OUT"
          echo "arm64=$ARM64_OUT" >> "$GITHUB_OUTPUT"
          echo "x86=$X86_OUT" >> "$GITHUB_OUTPUT"

      - name: Read release notes from update.xml
        id: notes
        run: |
          NOTES=$(sed -n '/<releaseNotes>/,/<\/releaseNotes>/p' android/app/update.xml | sed '1d;$d')
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "v${{ steps.version.outputs.version }} — Generation farm release"
          body: ${{ steps.notes.outputs.body }}
          files: |
            ${{ steps.apks.outputs.arm64 }}
            ${{ steps.apks.outputs.x86 }}
          draft: false
          prerelease: false
